
name: EKA - Build and Push to Amazon ECR

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "data/documents/**"
      - "data/sap_documents/**"
      - "data/vector_db/**"
      - "models/eka-distilbert-model/**"
      - "Dockerfile"
      - ".dockerignore"
      - "requirements.txt"
      - "start.sh"
      - ".github/workflows/build-and-push-ecr.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: eka-ecr-publish
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: enterprise-knowledge-assistant
  AWS_ACCOUNT_ID: "239711841693"

jobs:
  build-and-push:
    name: Build and publish EKA image
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true
          persist-credentials: false

      - name: Verify required application files
        shell: bash
        run: |
          set -euo pipefail

          test -f Dockerfile
          test -f start.sh
          test -f requirements.txt

          test -f models/eka-distilbert-model/config.json
          test -f models/eka-distilbert-model/model.safetensors

          test -d data/documents
          test -d data/sap_documents
          test -f data/vector_db/chroma.sqlite3

          MODEL_SIZE=$(stat -c%s \
            models/eka-distilbert-model/model.safetensors)

          echo "DistilBERT model size: ${MODEL_SIZE} bytes"

          if [ "$MODEL_SIZE" -lt 100000000 ]; then
            echo "ERROR: Model weights may be an LFS pointer."
            exit 1
          fi

          echo "Required deployment files verified."

      - name: Diagnose GitHub OIDC claims
        shell: bash
        run: |
          python - <<'PY'
          import os
          import json
          import base64
          import urllib.request

          request_url = (
              os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
              + "&audience=sts.amazonaws.com"
          )

          request = urllib.request.Request(
              request_url,
              headers={
                  "Authorization": (
                      "Bearer "
                      + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
                  )
              }
          )

          with urllib.request.urlopen(
              request, timeout=15
          ) as response:
              token = json.load(response)["value"]

          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)

          claims = json.loads(
              base64.urlsafe_b64decode(payload)
          )

          for key in ("iss", "aud", "sub"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::239711841693:role/EKA-GitHubActions-ECRRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: EKA-GitHubActions

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}

      - name: Display published image
        run: |
          echo "Image published to ECR:"
          echo "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:sha-${{ github.sha }}"
